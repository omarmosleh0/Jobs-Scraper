# ATS platform companies (Jordan + MENA tech)
companies:
  - name: Foodics
    scraper: workable
    config:
      account: foodics
      company_name: Foodics
      locations_filter: [JO, Jordan, Amman]

  - name: Talabat
    scraper: smartrecruiters
    config:
      company_id: talabat
      company_name: Talabat
      careers_url: https://careers.talabat.com/jobs
      locations_filter: [JO, Jordan, Amman]

  - name: PwC
    scraper: workday
    config:
      base_url: pwc.wd3.myworkdayjobs.com
      site_name: Global_Experienced_Careers
      tenant: pwc
      company_name: PwC
      locations_filter: [JO, Jordan, Amman]

  - name: Majid Al Futtaim
    scraper: phenom
    config:
      careers_url: https://careers.majidalfuttaim.com/global/en/search-results
      company_name: Majid Al Futtaim
      locations_filter: [JO, Jordan, Amman]

  - name: Jawaker
    scraper: zenats
    config:
      careers_url: https://careers.jawaker.com/en/careers_page
      company_name: Jawaker
      locations_filter: [JO, Jordan, Amman]

  - name: Almosafer
    scraper: jobsoid
    config:
      careers_url: https://jobs.almosafer.com/search/
      company_name: Almosafer
      locations_filter: [JO, Jordan, Amman]

  # Workable
  - name: TAMATEM
    scraper: workable
    config:
      account: tamatem
      company_name: TAMATEM
      locations_filter: [JO, Jordan, Amman]

  - name: Maqsam
    scraper: workable
    config:
      account: maqsam
      company_name: Maqsam
      locations_filter: [JO, Jordan, Amman]

  # ZenATS
  - name: WUDUH
    scraper: zenats
    config:
      careers_url: https://wuduh.zenats.com/en/careers_page
      company_name: WUDUH
      locations_filter: [JO, Jordan, Amman]

  # SmartRecruiters
  - name: Devoteam
    scraper: smartrecruiters
    config:
      company_id: devoteam
      company_name: Devoteam
      careers_url: https://me.devoteam.com/jobs
      locations_filter: [JO, Jordan, Amman]

  # Avature (Deloitte)
  - name: Deloitte
    scraper: avature
    config:
      base_url: middleeastjobs.deloitte.com
      careers_path: /careersME/SearchJobs
      company_name: Deloitte
      locations_filter: [JO, Jordan, Amman]

  # iCIMS (SITA) - fetch from careers-sita.icims.com, job links point to careers.sita.aero
  - name: SITA
    scraper: icims
    config:
      base_url: careers-sita.icims.com
      jobs_path: /jobs/search?in_iframe=1
      company_name: SITA
      locations_filter: [JO, Jordan, Amman]

