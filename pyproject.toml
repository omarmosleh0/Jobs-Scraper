[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobs-scraper"
version = "0.1.0"
description = "AI-powered job scraper for Jordan tech companies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "supabase>=2.0.0",
    "python-telegram-bot>=21.0",
    "scrapling[fetchers]>=0.1.0",
    "sentence-transformers>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.scripts]
jobs-scraper = "jobs_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs_scraper"]

[tool.hatch.build.targets.sdist]
packages = ["src/jobs_scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
